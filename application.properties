# CipherVault Enterprise Spring Boot 3.5 Configuration
server.port=8080
server.servlet.context-path=/

# MySQL Database Configuration
spring.datasource.url=jdbc:mysql://localhost:3306/ciphervault?useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true
spring.datasource.username=ciphervault_app
spring.datasource.password=vault_secure_pass
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# JPA / Hibernate Configuration
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect
spring.jpa.properties.hibernate.format_sql=true

# Security & JWT Configuration
ciphervault.jwt.secret=9a3f2c5d8e7b1a4f6c8d2e5b7a9c1d3f5e7a9b2c4d6f8a1c3e5b7d9f2a4c6e8b
ciphervault.jwt.expiration-ms=86400000

# File Storage Configuration
ciphervault.storage.location=./vault-ciphertexts
spring.servlet.multipart.max-file-size=50MB
spring.servlet.multipart.max-request-size=50MB

# Actuator & Swagger UI
management.endpoints.web.exposure.include=health,info,metrics
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.api-docs.path=/v3/api-docs
